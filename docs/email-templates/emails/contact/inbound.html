<p class="em-h" style="margin:0 0 14px 0;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;color:#0b1226;line-height:1.25;">{{name}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 22px 0;"><tr><td bgcolor="#6b11df" style="background-color:#6b11df;"><a href="mailto:{{email}}" style="display:inline-block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">Reply to {{name}}</a></td></tr></table>
<table role="presentation" class="em-panel" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f6fa" style="background-color:#f5f6fa;border:1px solid #d6dae6;border-left:3px solid #0af57c;margin:0 0 18px 0;"><tr><td style="padding:14px 18px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td class="em-m" style="padding:5px 12px 5px 0;font-family:Menlo,Consolas,'Courier New',monospace;font-size:12px;color:#6b7386;width:120px;vertical-align:top;">Name</td><td class="em-h" style="padding:5px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#0b1226;vertical-align:top;word-break:break-word;">{{name}}</td></tr>
<tr><td class="em-m" style="padding:5px 12px 5px 0;font-family:Menlo,Consolas,'Courier New',monospace;font-size:12px;color:#6b7386;width:120px;vertical-align:top;">Email</td><td class="em-h" style="padding:5px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#0b1226;vertical-align:top;word-break:break-word;">{{email}}</td></tr>
<tr><td class="em-m" style="padding:5px 12px 5px 0;font-family:Menlo,Consolas,'Courier New',monospace;font-size:12px;color:#6b7386;width:120px;vertical-align:top;">Member</td><td class="em-h" style="padding:5px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#0b1226;vertical-align:top;word-break:break-word;">{{member_line}}</td></tr>
</table></td></tr></table>
{{#message}}<div class="em-panel em-h" style="margin:0 0 18px 0;padding:14px 18px;background-color:#ffffff;border:1px solid #d6dae6;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#0b1226;line-height:1.6;white-space:pre-line;">{{message}}</div>{{/message}}
