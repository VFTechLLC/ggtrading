<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<!-- GG Trading INBOUND base: every notice the team gets from ggtrading.io (contact messages, signups, subscriptions).
     Built for scanning: a small header with the site and what this is, the content, and when and where it came from. -->
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  @media (prefers-color-scheme: dark) {
    .em-page { background-color: #000106 !important; }
    .em-card { background-color: #081431 !important; border-color: #1c2a4d !important; }
    .em-h { color: #e4e8ef !important; }
    .em-t { color: #c3cad8 !important; }
    .em-m { color: #8f9ab0 !important; }
    .em-panel { background-color: #050d24 !important; border-color: #1c2a4d !important; }
    .em-foot { background-color: #050d24 !important; border-color: #1c2a4d !important; }
    .em-link { color: #3df59a !important; }
  }
  [data-ogsc] .em-h { color: #e4e8ef !important; }
  [data-ogsc] .em-t { color: #c3cad8 !important; }
  [data-ogsc] .em-m { color: #8f9ab0 !important; }
  [data-ogsc] .em-link { color: #3df59a !important; }
  [data-ogsb] .em-page { background-color: #000106 !important; }
  [data-ogsb] .em-card { background-color: #081431 !important; }
  [data-ogsb] .em-panel { background-color: #050d24 !important; }
  [data-ogsb] .em-foot { background-color: #050d24 !important; }
  @media only screen and (max-width: 480px) {
    .em-pad { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body class="em-page" style="margin:0;padding:0;background-color:#eceef5;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#eceef5;">{{preheader}}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>

<table role="presentation" class="em-page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eceef5" style="background-color:#eceef5;">
<tr>
<td align="center" style="padding:24px 12px;">

<!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" class="em-card" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="max-width:600px;width:100%;background-color:#ffffff;border:1px solid #d6dae6;">

<!-- Header: site and what this email is -->
<tr>
<td class="em-pad" bgcolor="#02071c" style="background-color:#02071c;padding:12px 32px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td width="36" style="vertical-align:middle;"><img src="{{logo_url}}" width="28" height="29" alt="GG Trading" style="display:block;width:28px;height:auto;border:0;"></td>
<td style="vertical-align:middle;font-family:Menlo,Consolas,'Courier New',monospace;font-size:12px;color:#8f9ab0;">
<a href="{{link_home}}" style="color:#ffffff;text-decoration:none;font-weight:700;">GG TRADING</a> &nbsp;&middot;&nbsp; <span style="color:#0af57c;">{{header_label}}</span>
</td>
</tr>
</table>
</td>
</tr>

<!-- Body: the email's own content -->
<tr>
<td class="em-pad" style="padding:26px 32px 24px 32px;">
{{content}}
</td>
</tr>

<!-- Footer: when and where it came from -->
<tr>
<td class="em-foot em-pad" bgcolor="#f5f6fa" style="background-color:#f5f6fa;padding:16px 32px;border-top:1px solid #d6dae6;font-family:Arial,Helvetica,sans-serif;">
<p class="em-t" style="margin:0 0 6px 0;font-size:12px;color:#4a5368;line-height:1.6;">
Sent {{sent_at}} by <a class="em-link" href="{{link_home}}" style="color:#6b11df;">{{site_host}}</a>
</p>
<p class="em-m" style="margin:0;font-size:11px;color:#6b7386;line-height:1.55;">
{{footer_note}}
</p>
</td>
</tr>

</table>
<!--[if mso]></td></tr></table><![endif]-->

</td>
</tr>
</table>
</body>
</html>
